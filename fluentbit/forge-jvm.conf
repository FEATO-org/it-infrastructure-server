# The config is rendered per Swarm task; only the selected node gets this input.
{{ if eq .Node.ID (index .Service.Labels "feato.forge-jvm-node") }}
[INPUT]
  Name prometheus_scrape
  Tag metrics.forge-jvm
  Host app_minecraft-forge
  Port 9404
  Metrics_Path /metrics
  Scrape_Interval ${FORGE_JVM_SCRAPE_INTERVAL}

[OUTPUT]
  Name prometheus_remote_write
  Match metrics.forge-jvm
  Host ${PROMETHEUS_REMOTE_WRITE_HOST}
  Port 443
  URI /api/prom/push
  TLS On
  TLS.Verify On
  HTTP_User ${PROM_USER_ID}
  HTTP_Passwd ${GRAFANA_API_KEY}
  Add_Label app_mode ${APP_MODE}
  Add_Label monitor forge-jvm
  Add_Label job jmx-exporter
  Add_Label instance forge
  Log_Response_Payload false
{{ end }}
