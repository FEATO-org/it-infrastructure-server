[SERVICE]
  Flush                     5
  Grace                     30
  Log_Level                 info
  Parsers_File              parsers.conf
  storage.path              /fluent-bit/state
  storage.sync              normal
  storage.checksum          off
  storage.backlog.mem_limit 20M

[INPUT]
  Name              tail
  Tag               logs.docker.*
  Path              /var/lib/docker/containers/*/*.log
  Path_Key          source
  Parser            docker
  DB                /fluent-bit/state/docker-tail.db
  DB.Sync           normal
  Mem_Buf_Limit     50M
  Skip_Long_Lines   On
  Refresh_Interval  10
  Rotate_Wait       30
  storage.type      filesystem

[INPUT]
  Name              tail
  Tag               minecraft.latest
  Path              /minecraft/logs/latest.log
  DB                /fluent-bit/state/minecraft-tail.db
  DB.Sync           normal
  Read_from_Head    false
  Mem_Buf_Limit     10M
  Skip_Long_Lines   On
  Refresh_Interval  10
  Rotate_Wait       30
  storage.type      filesystem

[INPUT]
  Name              prometheus_scrape
  Tag               metrics.prometheus.cadvisor
  Host              cadvisor
  Port              8080
  Metrics_Path      /metrics
  Scrape_Interval   ${METRICS_SCRAPE_INTERVAL}

[INPUT]
  Name              prometheus_scrape
  Tag               metrics.prometheus.minecraft
  Host              minecraft-monitor
  Port              8080
  Metrics_Path      /metrics
  Scrape_Interval   ${METRICS_SCRAPE_INTERVAL}

[INPUT]
  Name              node_exporter_metrics
  Tag               metrics.prometheus.node
  Scrape_Interval   ${METRICS_SCRAPE_INTERVAL}
  Metrics           cpu,meminfo,diskstats,filesystem,uname,stat,loadavg,vmstat,netdev
  Path.Procfs       /host/proc
  Path.Sysfs        /host/sys
  Path.Rootfs       /host/root

[FILTER]
  Name    lua
  Match   minecraft.latest
  Script  /fluent-bit/etc/discord.lua
  Call    process_minecraft_log

[FILTER]
  Name  rewrite_tag
  Match minecraft.latest
  Rule  $route ^error$ minecraft.error false
  Rule  $route ^notify$ minecraft.notify false

[OUTPUT]
  Name                  http
  Match                 minecraft.notify
  Host                  discord.com
  Port                  443
  URI                   ${NOTIFY_WEBHOOK_URL}
  TLS                   On
  TLS.Verify            On
  Body_Key              $body
  Headers_Key           $headers
  Log_Response_Payload  false
  Retry_Limit           5

[OUTPUT]
  Name                  http
  Match                 minecraft.error
  Host                  discord.com
  Port                  443
  URI                   ${ERROR_WEBHOOK_URL}
  TLS                   On
  TLS.Verify            On
  Body_Key              $body
  Headers_Key           $headers
  Log_Response_Payload  false
  Retry_Limit           5

[OUTPUT]
  Name        loki
  Match       logs.docker.*
  Host        logs-prod-011.grafana.net
  Port        443
  TLS         On
  TLS.Verify  On
  HTTP_User   ${LOKI_USER_ID}
  HTTP_Passwd ${GRAFANA_API_KEY}
  Labels      app_mode=${APP_MODE}

[OUTPUT]
  Name                  prometheus_remote_write
  Match                 metrics.prometheus.cadvisor
  Host                  ${PROMETHEUS_REMOTE_WRITE_HOST}
  Port                  443
  URI                   /api/prom/push
  TLS                   On
  TLS.Verify            On
  HTTP_User             ${PROM_USER_ID}
  HTTP_Passwd           ${GRAFANA_API_KEY}
  Add_Label             app_mode ${APP_MODE}
  Add_Label             monitor cadvisor
  Log_Response_Payload  false

[OUTPUT]
  Name                  prometheus_remote_write
  Match                 metrics.prometheus.minecraft
  Host                  ${PROMETHEUS_REMOTE_WRITE_HOST}
  Port                  443
  URI                   /api/prom/push
  TLS                   On
  TLS.Verify            On
  HTTP_User             ${PROM_USER_ID}
  HTTP_Passwd           ${GRAFANA_API_KEY}
  Add_Label             app_mode ${APP_MODE}
  Add_Label             monitor minecraft
  Log_Response_Payload  false

[OUTPUT]
  Name                  prometheus_remote_write
  Match                 metrics.prometheus.node
  Host                  ${PROMETHEUS_REMOTE_WRITE_HOST}
  Port                  443
  URI                   /api/prom/push
  TLS                   On
  TLS.Verify            On
  HTTP_User             ${PROM_USER_ID}
  HTTP_Passwd           ${GRAFANA_API_KEY}
  Add_Label             app_mode ${APP_MODE}
  Add_Label             monitor node
  Add_Label             instance ${HOSTNAME}
  Log_Response_Payload  false
