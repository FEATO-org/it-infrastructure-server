# Hurricane Configuration
#
# These two official Geyser compatibility workarounds remove server-side
# collision for the affected blocks. This prevents Bedrock movement lagback,
# but means modified clients can pass through those blocks. Keep the scope to
# bamboo and pointed dripstone; do not add workarounds without review.
collision-fixes {
    bamboo=true
    pointed-dripstone=true
}

# The version of the config. DO NOT CHANGE!
version=1
