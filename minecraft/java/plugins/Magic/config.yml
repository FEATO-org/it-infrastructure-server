example: survival
add_examples:
  - valhalla

vanilla_icons_enabled: true

# Keep the official Valhalla pack selection, but let the existing FEATO pack pipeline send it.
resource_pack: valhalla
add_resource_pack: valhalla
enable_resource_pack: false
assume_resource_pack_downloaded: true

# Load rank variants, but only Valhalla perks may advance spells and paths.
enable_spell_upgrades: true
enable_automatic_spell_upgrades: false

valhalla:
  profile:
    enabled: true
