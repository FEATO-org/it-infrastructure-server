override:
  earns_type: valhalla_xp_magic
  earns_multiplier: 10
  earns_cooldown: 2 minutes

spellshop:
  actions:
    cast:
      - class: com.elmakers.mine.bukkit.integration.valhalla.OpenValhallaSkillTreeAction
  parameters:
    target: self

feato_wand_shop:
  inherit: buyshop
  hidden: true
  parameters:
    cost_type: currency
    confirm: true
    auto_close: true
    items:
      - item: wand|default
        cost: 150

missile:
  # Use the common XP recovery period instead of the upstream beginner bonus.
  earns_cooldown_scale: 1
  earns: 4
  actions:
    cast:
      - class: CustomProjectile
        actions:
          - class: Damage
  parameters:
    cooldown: 1500
    damage: 2
    target_breakables: 0
  costs:
    mana: 8

feato_light:
  icon: torch
  category: utility
  earns: 1
  actions:
    cast:
      - class: PotionEffect
  parameters:
    target: self
    duration: 120000
    effect_night_vision: 0
    cooldown: 5000
  costs:
    mana: 5

heal:
  earns: 4
  actions:
    cast:
      - class: Heal
  parameters:
    target: self
    amount: 4
    cooldown: 15000
  costs:
    mana: 20

fling:
