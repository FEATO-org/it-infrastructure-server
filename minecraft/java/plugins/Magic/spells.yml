# Rank II is granted by Valhalla perks; automatic progression remains disabled.
# DamageAction prioritizes upstream target-specific damage over generic damage.
missile|2:
  earns: 4
  earns_cooldown_scale: 1
  parameters:
    damage: 2.5
    player_damage: 2.5
    entity_damage: 2.5
    range: 28
    cooldown: 1500
    target_breakables: 0
  costs:
    mana: 9

