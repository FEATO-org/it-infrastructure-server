	[server.mega_structure]
		#Whether to generate custom biomes near mega structures
		generate_custom_biome = true
		#Whether to generate flattened terrain near mega structures
		generate_flat_terrain = true
		#Radius multiplier for flattened terrain near mega structures
		#Range: 0 ~ 10
		flat_terrain_radius_multiplier = 1
		#Whether to restrict mob spawning near mega structures (by default only vanilla non-creeper mobs are allowed)
		restrict_mob_spawning = true
		#If true, blocks other structures and placed features from generating inside MegaStructure coreRadius.
		preventOtherWorldgenInMegaCore = true
		#Default mega-structure generation speed applied during manager initialization. Allowed values: normal, fast.
		megaStructureGenerationSpeed = "normal"
		#If true, natural MegaStructures can also be planned for worlds that already existed before this mod was added.
		isgenerateStructureinexistworld = false

		[server.mega_structure.structure_sankta_holy_city]
