
[gun]
	#The default fire sound range (block)
	#Range: > 0
	DefaultGunFireSoundDistance = 64
	#The silencer default fire sound range (block)
	#Range: > 0
	DefaultGunSilenceSoundDistance = 16
	#The range (block) of other gun sound, reloading sound etc.
	#Range: > 0
	DefaultGunOtherSoundDistance = 16
	#Whether or not gunfire sound angers nearby mobs
	EnableGunSoundAnger = true
	#The default range (block) for gunfire sound to anger neutral mobs
	#Range: 0 ~ 64
	DefaultGunSoundNeutralMobAngerDistance = 24
	#The default range (block) for gunfire sound to attract hostile mobs
	#Range: 0 ~ 64
	DefaultGunSoundHostileMobAngerDistance = 32
	#Whether or not the player will consume ammo in creative mode
	CreativePlayerConsumeAmmo = true
	#Auto reload all the guns in player inventory, useful for pvp servers
	AutoReloadWhenRespawn = false

[ammo]
	#Warning: Ammo with explosive properties can break blocks
	ExplosiveAmmoDestroysBlock = true
	#Warning: Ammo with explosive properties can set the surroundings on fire
	ExplosiveAmmoFire = false
	#Ammo with explosive properties can add knockback effect
	ExplosiveAmmoKnockBack = true
	#The distance at which the explosion effect can be seen
	#Range: > 0
	ExplosiveAmmoVisibleDistance = 192
	#Blocks that bullets can pass through. Accepts block IDs and tags prefixed with #, e.g. minecraft:glass or #forge:glass.
	PassThroughBlocks = []
	#Allow bullets to destroy blocks listed in DestroyBlocks without drops. The name is retained for compatibility; the list is not limited to glass.
	DestroyGlass = true
	#Blocks that bullets can destroy when DestroyGlass is enabled, subject to DestroyBlockHardnessThreshold. Accepts block IDs and tags prefixed with #, e.g. minecraft:glass or #forge:glass.
	DestroyBlocks = ["#forge:glass", "#forge:glass_panes"]
	#Maximum block hardness for direct bullet destruction. Blocks above this threshold or with negative hardness (unbreakable) are never destroyed, even if listed in DestroyBlocks. Default: 1.0; vanilla glass has hardness 0.3.
	#Range: 0.0 ~ 1.7976931348623157E308
	DestroyBlockHardnessThreshold = 1.0
	#Whether a ammo can ignite the block
	IgniteBlock = true
	#Whether a ammo can ignite the entity
	IgniteEntity = true
	#Bullets pass through members of the shooter's scoreboard team when friendly fire is disabled, without consuming pierce count
	IgnoreTeamFriendlyFire = false
	#Enable the entity bullet damage ignore list. Listed entities are ignored by bullet hit detection and take no damage or knockback from ammo explosions.
	EnableBulletDamageIgnoreList = false
	#Entity type IDs protected from bullets and ammo explosions when EnableBulletDamageIgnoreList is enabled.
	BulletDamageIgnoreList = ["minecraft:painting", "minecraft:item_frame", "minecraft:glow_item_frame"]
	#Global bullet speed modifier, the init speed of the bullet will be multiplied by this value, default is 2.0
	#This is to compensate the side effects introduced while fixing the shooter variable input issue
	#Range: 0.01 ~ 20.0
	GlobalBulletSpeedModifier = 2.0

[other]
	#Deprecated and ignored: use [gunpack].DefaultPackDebug in <game directory>/tacz/tacz-pre.toml.
	DefaultPackDebug = false
	#The farthest sound distance of the target, including minecarts type
	#Range: > 0
	TargetSoundDistance = 128
	#DEV: Server hitbox offset (If the hitbox is ahead, fill in a negative number)
	#Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
	ServerHitboxOffset = 3.0
	#Server hitbox latency fix
	ServerHitboxLatencyFix = true
	#The maximum latency (in milliseconds) for the server hitbox latency fix saved
	#Range: 250.0 ~ 1.7976931348623157E308
	ServerHitboxLatencyMaxSaveMs = 1000.0
