# Shared with the Paper Floodgate instance through a Docker Swarm secret.
key-file-name: /run/secrets/floodgate_key

username-prefix: "."
replace-spaces: true

# Forward encrypted Bedrock player data to backend Floodgate instances.
send-floodgate-data: true

disconnect:
  invalid-key: Please connect through the official Geyser
  invalid-arguments-length: Expected {} arguments, got {}. Is Geyser up-to-date?

player-link:
  enabled: true
  require-link: false
  enable-own-linking: false
  allowed: true
  link-code-timeout: 300
  type: sqlite
  enable-global-linking: true

metrics:
  enabled: false
  uuid: a5fe835c-dd39-4531-84b6-9116de345ea5

config-version: 3
