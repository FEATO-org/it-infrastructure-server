name: Validate changes

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PR branch flow
        env:
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/patchnotes/validate_branch_flow.py
          --base "$PR_BASE" --head "$PR_HEAD" --base-sha "$PR_BASE_SHA"
      - name: Test patchnote tooling
        run: python -m unittest discover -s scripts/patchnotes -p 'test_*.py'
      - run: python scripts/patchnotes/validate_changes.py
