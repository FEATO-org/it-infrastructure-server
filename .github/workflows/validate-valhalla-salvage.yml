name: Validate Valhalla salvage

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'minecraft/java/startup/**'
      - 'minecraft/java/prepare-paper-plugins.sh'
      - 'minecraft/java/plugins.txt'
      - 'deploys/app/compose.yml'
      - 'script/test_valhalla_salvage.py'
      - '.github/workflows/validate-valhalla-salvage.yml'

permissions:
  contents: read

jobs:
  salvage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download reviewed official test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/salvage"
          curl -fL --retry 3 https://cdn.modrinth.com/data/rxrgsoud/versions/GkeSDJSq/ValhallaMMO_1.10.3.jar -o "$RUNNER_TEMP/salvage/ValhallaMMO.jar"
          curl -fL --retry 3 https://github.com/itzg/mc-image-helper/releases/download/1.73.1/mc-image-helper-1.73.1.tgz -o "$RUNNER_TEMP/salvage/helper.tgz"
          tar -xzf "$RUNNER_TEMP/salvage/helper.tgz" -C "$RUNNER_TEMP/salvage"
      - name: Test actual startup correction with official recipes
        env:
          VALHALLA_JAR: ${{ runner.temp }}/salvage/ValhallaMMO.jar
          MC_HELPER_LIB: ${{ runner.temp }}/salvage/mc-image-helper-1.73.1/lib
        run: |
          sh -n minecraft/java/prepare-paper-plugins.sh
          sh -n minecraft/java/startup/valhalla-salvage.sh
          python3 script/test_valhalla_salvage.py
