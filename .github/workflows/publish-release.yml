name: Publish Minecraft release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version to recover (YYYY-MM-DD.N)'
        required: true
        type: string
      confirm_no_delivery:
        description: 'I checked Discord and none of this release was posted'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: minecraft-release-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify merged release PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RECOVERY_VERSION: ${{ inputs.version }}
          CONFIRM_NO_DELIVERY: ${{ inputs.confirm_no_delivery }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$CONFIRM_NO_DELIVERY" != true ]]; then
              echo "Confirm that no Discord messages were posted before recovery" >&2
              exit 1
            fi
            python scripts/patchnotes/release_control.py resume --version "$RECOVERY_VERSION"
          else
            python scripts/patchnotes/release_control.py detect --before "$BEFORE" --after "$AFTER"
          fi
      - name: Verify generated content and build Discord payload
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/patchnotes/validate_changes.py --input-dir "changes/released/$VERSION" --require-nonempty
          python scripts/patchnotes/generate_patchnote.py \
            --version "$VERSION" --input-dir "changes/released/$VERSION" \
            --output "$RUNNER_TEMP/${VERSION:0:4}/$VERSION.md"
          cmp "patchnotes/${VERSION:0:4}/$VERSION.md" "$RUNNER_TEMP/${VERSION:0:4}/$VERSION.md"
          python scripts/patchnotes/generate_discord_payload.py \
            --version "$VERSION" --input-dir "changes/released/$VERSION" \
            --output "$RUNNER_TEMP/discord-payload.json"
      - name: Publish GitHub Release and Discord
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_PATCHNOTE_WEBHOOK_URL: ${{ secrets.DISCORD_PATCHNOTE_WEBHOOK_URL }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          recovery_args=()
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            recovery_args=(--existing-release-only --retry-undelivered)
          fi
          python scripts/patchnotes/publish_release.py \
            --version "$VERSION" --commit "$COMMIT" \
            --patchnote "patchnotes/${VERSION:0:4}/$VERSION.md" \
            --payload "$RUNNER_TEMP/discord-payload.json" "${recovery_args[@]}"
