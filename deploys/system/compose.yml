version: "3.8"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mariadb:
    image: ${MARIADB_IMAGE:-ghcr.io/feato-org/feato-mariadb:main}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_app_password
    secrets:
      - mariadb_root_password
      - mariadb_app_password
      - luckperms_db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - database-network
    healthcheck:
      test:
        - CMD-SHELL
        - healthcheck.sh --connect --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.database-data == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1G
    logging: *default-logging

  fluent-bit:
    image: ${FLUENT_BIT_IMAGE:-ghcr.io/feato-org/feato-fluent-bit:main}
    command:
      - /fluent-bit/bin/fluent-bit
      - -c
      - /fluent-bit/etc/fluent-bit.conf
    environment:
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL}
      LOKI_USER_ID: ${LOKI_USER_ID}
      PROM_USER_ID: ${PROM_USER_ID}
      PROMETHEUS_REMOTE_WRITE_HOST: ${PROMETHEUS_REMOTE_WRITE_HOST:-prometheus-prod-18-prod-ap-southeast-0.grafana.net}
      METRICS_SCRAPE_INTERVAL: ${METRICS_SCRAPE_INTERVAL:-2m}
      GRAFANA_API_KEY: ${GRAFANA_API_KEY}
      APP_MODE: ${APP_MODE}
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - minecraft_server_data:/minecraft:ro
      - fluent_bit_state:/fluent-bit/state
    networks:
      - monitoring-network
    deploy:
      mode: global
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 256M
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --disable_root_cgroup_stats=true
      - --enable_metrics=cpu,memory,network,oom_event
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring-network
    deploy:
      mode: global
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          memory: 64M
        limits:
          memory: 512M
    logging: *default-logging

  minecraft-monitor:
    image: itzg/mc-monitor:0.17.1
    command:
      - export-for-prometheus
    environment:
      EXPORT_SERVERS: app_minecraft-server
      DEBUG: "false"
    networks:
      - monitoring-network
      - minecraft-backend-network
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M
    logging: *default-logging

  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/feato-org/feato-nginx:main}
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 25565
        published: 25565
        protocol: tcp
        mode: host
      - target: 19132
        published: 19132
        protocol: tcp
        mode: host
      - target: 19132
        published: 19132
        protocol: udp
        mode: host
      - target: 19133
        published: 19133
        protocol: udp
        mode: host
    secrets:
      - source: tls_fullchain
        target: tls_fullchain.pem
      - source: tls_private_key
        target: tls_privkey.pem
    networks:
      - web-ingress-network
      - minecraft-ingress-network
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.edge == true
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 256M
    logging: *default-logging

networks:
  monitoring-network:
    driver: overlay
    driver_opts:
      encrypted: "true"
  database-network:
    external: true
  web-ingress-network:
    external: true
  minecraft-ingress-network:
    external: true
  minecraft-backend-network:
    external: true

volumes:
  mariadb_data:
  fluent_bit_state:
  minecraft_server_data:
    external: true
    name: app_minecraft_server_data

secrets:
  mariadb_root_password:
    external: true
  mariadb_app_password:
    external: true
  tls_fullchain:
    external: true
    name: ${TLS_FULLCHAIN_SECRET}
  tls_private_key:
    external: true
    name: ${TLS_PRIVATE_KEY_SECRET}
  luckperms_db_password:
    external: true
