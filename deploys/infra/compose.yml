version: "3.8"

services:
  portainer-agent:
    image: portainer/agent:2.45.0
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-agent
      LOG_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    networks:
      - portainer-agent-network
    deploy:
      mode: global
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  portainer-host:
    image: portainer/portainer-ee:2.45.0
    command:
      - -H
      - tcp://tasks.portainer-agent:9001
      - --tlsskipverify
    volumes:
      - portainer_data:/data
    networks:
      - portainer-agent-network
      - portainer-tunnel-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.portainer-data == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - portainer-tunnel-network
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.cloudflare-tunnel == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 120s
    logging: *default-logging

networks:
  portainer-agent-network:
    driver: overlay
    driver_opts:
      encrypted: "true"
  portainer-tunnel-network:
    driver: overlay
    driver_opts:
      encrypted: "true"

volumes:
  portainer_data:

secrets:
  cloudflare_tunnel_token:
    external: true
