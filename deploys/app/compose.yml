version: "3.8"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sfs-discord-server:
    image: ghcr.io/feato-org/support-feato-system:main
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_IDS: ${GUILD_IDS}
      APP_MODE: ${APP_MODE}
      NOTIFY_CHANNEL_ID: ${NOTIFY_CHANNEL_ID}
    networks:
      - app-internal-network
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M
    logging: *default-logging

  minecraft-proxy:
    image: itzg/mc-proxy:java21
    environment:
      TYPE: VELOCITY
      MINECRAFT_VERSION: ${MINECRAFT_VERSION:-1.21.5}
      MEMORY: 1G
      PLUGINS: |-
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/velocity
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/velocity
    secrets:
      - source: forwarding_secret
        target: forwarding_secret
    volumes:
      - minecraft_proxy_data:/server
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft-proxy/config:/config:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft-proxy/plugins:/plugins
      - ${MINECRAFT_ASSET_ROOT:-/opt/it-infrastructure-server/resources/minecraft}/texturepacks:/plugins/Geyser-Velocity/packs:ro
    networks:
      - minecraft-ingress-network
      - minecraft-backend-network
    stop_grace_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.minecraft-data == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 1536M
    logging: *default-logging

  minecraft-server:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      NETWORK_COMPRESSION_THRESHOLD: "-1"
      MEMORY: 5G
      VERSION: ${MINECRAFT_VERSION:-1.21.5}
      TYPE: PAPER
      GAMEMODE: survival
      DIFFICULTY: normal
      SERVER_NAME: FEATO
      SPAWN_PROTECTION: "0"
      PLAYER_IDLE_TIMEOUT: "90"
      VIEW_DISTANCE: "14"
      SIMULATION_DISTANCE: "8"
      SPIGET_RESOURCES: "110400,87480,84809,89188,99663,109630,57242"
      PLUGINS_FILE: /extras/plugins.txt
      DATAPACKS: /extras/datapacks
      ENABLE_COMMAND_BLOCK: "TRUE"
      COPY_CONFIG_DEST: /data
      REPLACE_ENV_VARIABLES: "TRUE"
      REPLACE_ENV_DURING_SYNC: "TRUE"
      REPLACE_ENV_VARIABLE_PREFIX: CFG_
      CFG_FORWARDING_SECRET_FILE: /run/secrets/forwarding_secret
      RESOURCE_PACK_ENFORCE: "TRUE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      GUI: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      UID: "1000"
      GID: "1000"
      TZ: Asia/Tokyo
      LOG_TIMESTAMP: "true"
      ENABLE_ROLLING_LOGS: "true"
      USE_AIKAR_FLAGS: "true"
      INIT_MEMORY: 1G
      MAX_MEMORY: 5G
      MAX_TICK_TIME: "60000"
    secrets:
      - source: forwarding_secret
        target: forwarding_secret
      - source: rcon_password
        target: rcon_password
    volumes:
      - minecraft_server_data:/data
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/plugins.txt:/extras/plugins.txt:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/plugins:/plugins
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/config/bukkit.yml:/config/bukkit.yml:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/config/spigot.yml:/config/spigot.yml:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/config/paper-global.yml:/config/config/paper-global.yml:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/config/paper-world-defaults.yml:/config/config/paper-world-defaults.yml:ro
      - ${MINECRAFT_ASSET_ROOT:-/opt/it-infrastructure-server/resources/minecraft}/datapacks:/extras/datapacks:ro
    networks:
      - minecraft-backend-network
      - web-ingress-network
    stop_grace_period: 2m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.minecraft-data == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      resources:
        reservations:
          memory: 2G
        limits:
          memory: 6G
    logging: *default-logging

networks:
  app-internal-network:
    driver: overlay
    driver_opts:
      encrypted: "true"
  minecraft-ingress-network:
    external: true
  minecraft-backend-network:
    external: true
  web-ingress-network:
    external: true

volumes:
  minecraft_proxy_data:
  minecraft_server_data:

secrets:
  forwarding_secret:
    external: true
  rcon_password:
    external: true
