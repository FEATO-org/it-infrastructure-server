version: "3.8"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sfs-discord-server:
    image: ghcr.io/feato-org/support-feato-system:main
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_IDS: ${GUILD_IDS}
      APP_MODE: ${APP_MODE}
      NOTIFY_CHANNEL_ID: ${NOTIFY_CHANNEL_ID}
    networks:
      - app-internal-network
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations:
          memory: 16M
        limits:
          memory: 64M
    logging: *default-logging

  minecraft-proxy:
    image: itzg/mc-proxy:java25
    entrypoint: ["/bin/bash", "/rcon-init/proxy-rcon-entrypoint.sh"]
    command: ["/usr/bin/run-bungeecord.sh"]
    environment:
      TYPE: VELOCITY
      VELOCITY_VERSION: "4.2.0"
      VELOCITY_BUILD_ID: "30"
      MINECRAFT_VERSION: ${MINECRAFT_VERSION:-26.2}
      MEMORY: 1G
      REPLACE_ENV_VARIABLES: "TRUE"
      REPLACE_ENV_DURING_SYNC: "TRUE"
      REPLACE_ENV_VARIABLE_PREFIX: CFG_
      PATCH_DEFINITIONS: /patches/geyser-nethernet.json
      CFG_LUCKPERMS_PASSWORD_FILE: /run/secrets/luckperms_db_password
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      # Java 25 compact headers; retain automatic G1 region sizing for 1G heap.
      JVM_XX_OPTS: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:+AlwaysPreTouch
        -XX:+DisableExplicitGC
        -XX:MaxGCPauseMillis=200
        -XX:+UseCompactObjectHeaders
      JVM_OPTS: --enable-native-access=ALL-UNNAMED
      PLUGINS: |-
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/velocity
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/velocity
        https://cdn.modrinth.com/data/Vebnzrzj/versions/tamnmXad/LuckPerms-Velocity-5.5.71.jar
    secrets:
      - source: forwarding_secret
        target: forwarding_secret
      - source: luckperms_db_password
        target: luckperms_db_password
      - source: minecraft_proxy_rcon_password
        target: minecraft_proxy_rcon_password
    volumes:
      - minecraft_proxy_data:/server
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft-proxy/proxy-rcon-entrypoint.sh:/rcon-init/proxy-rcon-entrypoint.sh:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft-proxy/patches:/patches:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft-proxy/config:/config:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft-proxy/plugins:/plugins:ro
      - ${MINECRAFT_ASSET_ROOT:-/opt/it-infrastructure-server/resources/minecraft}/resourcepacks/bedrock:/plugins/Geyser-Velocity/packs:ro
      - ${MINECRAFT_ASSET_ROOT:-/opt/it-infrastructure-server/resources/minecraft}/geyser/custom_mappings:/plugins/Geyser-Velocity/custom_mappings:ro
    networks:
      - minecraft-ingress-network
      - minecraft-backend-network
      - database-network
    stop_grace_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.minecraft-data == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 1536M
    logging: *default-logging

  minecraft-server:
    image: ${MINECRAFT_SERVER_IMAGE:-itzg/minecraft-server:java25-graalvm}
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      NETWORK_COMPRESSION_THRESHOLD: "-1"
      MEMORY: 6G
      VERSION: ${MINECRAFT_VERSION:-26.2}
      TYPE: PAPER
      GAMEMODE: survival
      DIFFICULTY: normal
      SERVER_NAME: FEATO
      SPAWN_PROTECTION: "0"
      PLAYER_IDLE_TIMEOUT: "90"
      VIEW_DISTANCE: "14"
      SIMULATION_DISTANCE: "8"
      # Better Horses has no immutable release asset; Spiget resource 124223 resolves the author release.
      SPIGET_RESOURCES: ${BETTER_HORSES_SPIGET_RESOURCE:-124223}
      PLUGINS_FILE: /extras/plugins.txt
      # Remove superseded FEATO release JARs before downloading current entries.
      REMOVE_OLD_MODS: "TRUE"
      REMOVE_OLD_MODS_INCLUDE: "FEATO-Ancient-Coin-*.jar,FEATO-Coin-Exchange-*.jar"
      REMOVE_OLD_MODS_DEPTH: "1"
      DATAPACKS: |-
        /extras/datapacks
      DATAPACKS_FILE: /extras/datapacks.txt
      ENABLE_COMMAND_BLOCK: "TRUE"
      COPY_CONFIG_DEST: /data
      REPLACE_ENV_VARIABLES: "TRUE"
      REPLACE_ENV_DURING_SYNC: "TRUE"
      REPLACE_ENV_VARIABLE_PREFIX: CFG_
      CFG_FORWARDING_SECRET_FILE: /run/secrets/forwarding_secret
      CFG_LUCKPERMS_PASSWORD_FILE: /run/secrets/luckperms_db_password
      RESOURCE_PACK_ENFORCE: "TRUE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      GUI: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      UID: "1000"
      GID: "1000"
      TZ: Asia/Tokyo
      LOG_TIMESTAMP: "true"
      ENABLE_ROLLING_LOGS: "true"
      USE_AIKAR_FLAGS: "false"
      USE_MEOWICE_FLAGS: "true"
      USE_MEOWICE_GRAALVM_FLAGS: "true"
      # VPS may not expose invariant TSC or a NUMA topology.
      JVM_OPTS: -XX:-UseFastUnorderedTimeStamps -XX:-UseNUMA
      INIT_MEMORY: 1G
      MAX_MEMORY: 6G
      MAX_TICK_TIME: "60000"
    secrets:
      - source: forwarding_secret
        target: forwarding_secret
      - source: luckperms_db_password
        target: luckperms_db_password
      - source: rcon_password
        target: rcon_password
    volumes:
      - minecraft_server_data:/data
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/plugins.txt:/extras/plugins.txt:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/plugins:/plugins:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/config/bukkit.yml:/config/bukkit.yml:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/config/spigot.yml:/config/spigot.yml:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/config/paper-global.yml:/config/config/paper-global.yml:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/config/paper-world-defaults.yml:/config/config/paper-world-defaults.yml:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/datapacks:/extras/datapacks:ro
      - ${DEPLOY_ROOT:-/opt/it-infrastructure-server}/minecraft/java/datapacks.txt:/extras/datapacks.txt:ro
    networks:
      - minecraft-backend-network
      - database-network
      - web-ingress-network
    stop_grace_period: 2m
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.minecraft-data == true
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      resources:
        reservations:
          memory: 2G
        limits:
          memory: 7G
    logging: *default-logging

networks:
  app-internal-network:
    driver: overlay
    driver_opts:
      encrypted: "true"
  minecraft-ingress-network:
    external: true
  minecraft-backend-network:
    external: true
  web-ingress-network:
    external: true
  database-network:
    external: true

volumes:
  minecraft_proxy_data:
  minecraft_server_data:

secrets:
  forwarding_secret:
    external: true
  rcon_password:
    external: true
  minecraft_proxy_rcon_password:
    external: true
  luckperms_db_password:
    external: true
