upstream minecraft_java {
    server app_minecraft-proxy:25577;
}

server {
    listen 25565;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    proxy_pass minecraft_java;
}

upstream minecraft_bedrock {
    server app_minecraft-proxy:19132;
}

upstream minecraft_bedrock_webrtc {
    server app_minecraft-proxy:19133;
}

server {
    # Geyser's built-in NetherNet signaling shares the Bedrock port over TCP.
    listen 19132;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    proxy_pass minecraft_bedrock;
}

server {
    listen 19132 udp reuseport;
    proxy_timeout 1h;
    proxy_pass minecraft_bedrock;
}

server {
    # NetherNet WebRTC uses a separate UDP port when RakNet remains enabled.
    listen 19133 udp reuseport;
    proxy_timeout 1h;
    proxy_pass minecraft_bedrock_webrtc;
}
