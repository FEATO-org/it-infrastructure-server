upstream minecraft_java {
    zone minecraft_java 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server app_minecraft-proxy:25577 resolve;
}

server {
    listen 25565;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    proxy_pass minecraft_java;
}

upstream minecraft_bedrock {
    zone minecraft_bedrock 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server app_minecraft-proxy:19132 resolve;
}

upstream minecraft_bedrock_webrtc {
    zone minecraft_bedrock_webrtc 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server app_minecraft-proxy:19133 resolve;
}

server {
    # Geyser's built-in NetherNet signaling shares the Bedrock port over TCP.
    listen 19132;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
    proxy_pass minecraft_bedrock;
}

server {
    listen 19132 udp reuseport;
    proxy_timeout 1h;
    proxy_pass minecraft_bedrock;
}

server {
    # NetherNet WebRTC uses a separate UDP port when RakNet remains enabled.
    listen 19133 udp reuseport;
    proxy_timeout 1h;
    proxy_pass minecraft_bedrock_webrtc;
}
